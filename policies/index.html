<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Policies - RhythmFlow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            line-height: 1.8;
            color: #2c3e50;
            background: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 50px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.08);
            border-radius: 8px;
            text-align: center;
        }

        .header {
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            color: #1e3c72;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            color: #7f8c8d;
            font-size: 1.1em;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .policy-link {
            display: block;
            padding: 20px 30px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1.2em;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .policy-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .footer {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #ecf0f1;
            color: #7f8c8d;
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 25px;
            }
            
            .policy-link {
                font-size: 1em;
                padding: 15px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎵 RhythmFlow</h1>
            <p>Legal Policies</p>
        </div>
        
        <div class="links">
            <a href="privacy-policy.html" class="policy-link">Privacy Policy</a>
            <a href="terms-conditions.html" class="policy-link">Terms and Conditions</a>
        </div>

        <div class="footer">
            <p><strong>RhythmFlow</strong> - Where AI meets Music</p>
            <p>© 2025 TechNexa Innovations. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
